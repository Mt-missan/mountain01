        <button class="btn-option" onclick="answer(2, 1)">🌙 夕〜夜（静かな月・澄んだ星空）</button>
    </div>

        <button class="btn-option" onclick="answer(4, 4)">🟣 神秘の「パープル」</button>
    </div>

    function answer(qNum, choiceIndex) {
        userChoices.push(choiceIndex);

            let nextQ = qNum + 1;
            document.getElementById('progress').innerText = `QUESTION ${nextQ} / 4`;
            document.getElementById(`q${nextQ}`).classList.add('active');
        } else {
            document.getElementById('progress').innerText = "DIAGNOSIS COMPLETE";
            calculateResult();
        }
    }

        document.getElementById('res-desc').innerText = 
            `100の選択肢の中から、あなたの直感が引き寄せた山は【${m.name}】です。` +
            `選択したマインドやカラーが示す通り、今のあなたには「${m.tag}」のエネルギーが強く共鳴しています。` +
            `この山を訪れたり画像を壁紙に設定したりすることで、あなたの運気はさらに高まるでしょう。`;

        document.getElementById('result').classList.add('active');
    }

    async function shareResult() {
        const mountainName = document.getElementById('res-name').innerText;
        const shareData = {
            title: '日本百名山 100占い',
            text: `私の運命の日本百名山は【${mountainName}】でした！\n直感で導く「日本百名山 100占い」診断はこちら🏔️\n`,
            url: location.href
        };

        if (navigator.share) {
            try {
                await navigator.share(shareData);
            } catch (err) {
                // キャンセル時などは何も処理しない
            }
        } else {
            const copyText = `${shareData.text}${shareData.url}`;
            navigator.clipboard.writeText(copyText).then(() => {
                alert('結果とURLをクリップボードにコピーしました！SNS等に貼り付けてご共有ください。');
            }).catch(() => {
                alert('コピーに失敗しました。URLを直接コピーしてください。');
            });
        }
    }

    function restart() {
        userChoices = [];
        document.getElementById('result').classList.remove('active');
        document.getElementById('progress').innerText = "QUESTION 1 / 4";
        document.getElementById('q1').classList.add('active');
    }
</script>

</body>
